# Global settings applied to the whole site.
#
# "publish" is the directory to publish (relative to root of your repo),
# "command" is your build command,
# "base" is directory to change to before starting build. if you set base:
#    that is where we will look for package.json/.nvmrc/etc not repo root!

[build]
  publish = "docs/packages"
  command = "echo '=== ROOT INSTALL ===' && npm install --ignore-scripts && echo '=== CORE INSTALL ===' && cd packages/ui-predicate-core && npm install --ignore-scripts && echo '=== CORE BUILD ===' && npm run build && echo '=== CORE DOCS ===' && npm run docs:build && echo '=== VUE3 INSTALL ===' && cd ../ui-predicate-vue3 && npm install && echo '=== VUE3 BUILD ===' && npm run build && echo '=== VUE3 DOCS ===' && npm run docs:build && echo '=== INDEX ===' && cd ../.. && node scripts/docs-build-index.js && echo '=== DONE ==='"

[build.environment]
  NODE_VERSION = "18"
  PYTHON_VERSION = "3.11"
  NPM_FLAGS = "--ignore-scripts"
